[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ada-datasets"
version = "0.2.0"
description = "ADA Curator: provenance-first reproducible training-data preparation"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "ARcHi / ADA Research"}]
dependencies = []

[project.scripts]
ada-curate = "ada_datasets.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
