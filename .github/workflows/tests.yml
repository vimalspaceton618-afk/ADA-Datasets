name: ADA Curator checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit-and-security:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install local package
        run: python -m pip install -e .
      - name: Run offline tests
        run: python -m unittest discover -s tests -v
      - name: CLI smoke
        run: |
          ada-curate run --input examples/input.jsonl --sources examples/sources.json --output /tmp/ada-curator-ci
          ada-curate verify --output /tmp/ada-curator-ci
          ada-curate assess --snapshot /tmp/ada-curator-ci --report /tmp/ada-curator-quality.json
          ada-curate revoke --parent /tmp/ada-curator-ci --tombstones examples/demo_tombstones.jsonl --output /tmp/ada-curator-postrevocation
          ada-curate verify --output /tmp/ada-curator-postrevocation
      - name: Check Python syntax
        run: python -m compileall -q src
