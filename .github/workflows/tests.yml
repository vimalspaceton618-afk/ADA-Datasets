name: ADA Curator checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit-and-security:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install local package
        run: python -m pip install -e .
      - name: Run offline tests
        run: python -m unittest discover -s tests -v
      - name: CLI smoke
        run: |
          ada-curate run --input examples/input.jsonl --sources examples/sources.json --output /tmp/ada-curator-ci
          ada-curate verify --output /tmp/ada-curator-ci
          ada-curate assess --snapshot /tmp/ada-curator-ci --report /tmp/ada-curator-quality.json
          ada-curate revoke --parent /tmp/ada-curator-ci --tombstones examples/demo_tombstones.jsonl --output /tmp/ada-curator-postrevocation
          ada-curate verify --output /tmp/ada-curator-postrevocation
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          input_path = Path("examples/input.jsonl")
          with Path("/tmp/ada-filter-gold.jsonl").open("w", encoding="utf-8") as dst:
              with input_path.open(encoding="utf-8") as source:
                  for n, line in enumerate(source, 1):
                      row = json.loads(line)
                      gold = {
                          "line": n,
                          "input_line_sha256": hashlib.sha256(line.encode()).hexdigest(),
                          "should_keep": row["source_id"] == "archi-authored-demo",
                          "language": "en",
                      }
                      dst.write(json.dumps(gold) + "\n")
          PY
          ada-curate evaluate-filter --snapshot /tmp/ada-curator-ci --input examples/input.jsonl --gold /tmp/ada-filter-gold.jsonl --report /tmp/ada-filter-evaluation.json
      - name: Check Python syntax
        run: python -m compileall -q src
  release-wheel-and-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build and install release wheel
        shell: bash
        run: |
          python -m pip wheel --no-deps --wheel-dir dist .
          shopt -s nullglob
          wheels=(dist/*.whl)
          test "${#wheels[@]}" -eq 1
          python -m pip install "${wheels[0]}[release,models]"
          python -c 'import fasttext, pyarrow, tokenizers'
      - name: Exercise the installed release CLI
        run: python -m unittest discover -s tests -v
      - name: Upload verified wheel
        uses: actions/upload-artifact@v4
        with:
          name: ada-datasets-wheel
          path: dist/*.whl
          if-no-files-found: error
          retention-days: 14
